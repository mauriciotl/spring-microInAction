spring:
  application:
    name: config-server
  profiles:
    active:
      - vault
      - git
  config:
    import: vault://secret/config-server

server:
  port: 8071

encrypt:
  key: ${ENCRYPT_KEY}

# Enable all Spring Boot Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework: DEBUG
#    org.springframework.cloud.config: DEBUG
#    org.eclipse.jgit: DEBUG