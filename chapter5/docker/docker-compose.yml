services:
  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "ostock_dev"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      backend:
        aliases:
          - "database"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  configserver:
    env_file:
      - .env
    build:
      context: ../configserver
      dockerfile: Dockerfile
    image: ostock/configserver:0.0.1-SNAPSHOT
    ports:
      - "8071:8071"
    environment:
      - SPRING_PROFILES_ACTIVE=git,vault # Enable vault profile
      - ENCRYPT_KEY=${ENCRYPT_KEY} # Only for fetching from .env file
      - SPRING_CLOUD_VAULT_HOST=host.docker.internal # Access Vault on host
      - SPRING_CLOUD_VAULT_PORT=8200
      - SPRING_CLOUD_VAULT_SCHEME=http
      - SPRING_CLOUD_VAULT_TOKEN=root # Insecure; replace in production
      - SPRING_CLOUD_VAULT_AUTHENTICATION=TOKEN
    networks:
      backend:
        aliases:
          - "configserver"

  licensingservice:
    build:
      context: ../licensing-service
      dockerfile: Dockerfile
    image: ostock/licensing-service:0.0.2-SNAPSHOT
    environment:
      PROFILE: "dev"
      CONFIGSERVER_URI: "http://configserver:8071"
      CONFIGSERVER_PORT: "8071"
      DATABASESERVER_PORT: "5432"
    depends_on:
      database:
        condition: service_healthy
      configserver:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - backend

networks:
  backend:
    driver: bridge