services:

  configserver:
    build:
      context: ../configserver
      dockerfile: Dockerfile
    ports:
      - "8071:8071"
    environment:
      ENCRYPT_KEY: "fje83Ki8403Iod87dne7Yjsl3THueh48jfuO9j4U2hf64Lo"
      SPRING_PROFILES_ACTIVE: "git"
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/mauriciotl/ConfMgmtSpringMicro.git"
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: "mauriciotl"
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: "github_pat_redacted MAU: Upadate with the right curret one"
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: "main"
    networks:
      backend:
        aliases:
          - "configserver"

  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "ostock_dev"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      backend:
        aliases:
          - "database"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  licensingservice:
    build:
      context: ../licensing-service
      dockerfile: Dockerfile
    environment:
      SPRING_CLOUD_CONFIG_URI: "http://configserver:8071"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database:5432/ostock_dev"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      ENCRYPT_KEY: "IMSYMMETRIC"
    depends_on:
      database:
        condition: service_healthy
      configserver:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - backend

networks:
  backend:
    driver: bridge